<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}" layout:fragment="content">
<style>
	.tui-datepicker,
	.tui-timepicker {
		z-index: 1050 !important;
		overflow: visible !important;
	}

	.tui-grid-cell-summary {
		background-color: #ddd;
		border-color: #fff;
		border-left-width: 1px;
		border-right-width: 1px;
		color: #333;
	}
</style>

<body>
	<main id="main" class="main">
		<section class="section">
			<div class="row">
				<div class="col-lg-12">
					<div class="card" id="div_card">
						<div class="card-body">
							<h5 class="card-title">로그</h5>

							<!-- General Form Elements -->

							<!-- 필터 UI -->
							<div id="filterModule" class="mb-3"></div>

							<div id="grid"></div>
							<br>

							<!-- End General Form Elements -->
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<div id="grid"></div>

	<!-- Modal (상세 로그 조회) -->
	<div class="modal fade" id="logDetailModal" tabindex="-1" aria-labelledby="logDetailModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="logDetailModalLabel">Log Details</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<!-- JSON Data Display -->
					<pre id="modalLogDetails" class="bg-light p-3 rounded"
						style="white-space: pre-wrap; word-wrap: break-word;"></pre>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>

</body>

<!-- 필터 모듈 JS File -->
<script th:inline="javascript">
	const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
	const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

	let grid;

	document.addEventListener('DOMContentLoaded', function () {

		$(window).resize(function () {
			setElementHeight('#div_card', -105);
			if (grid != null) {
				setGridHeight(grid, -430);
			}
		});

		$(document).on('filterToggled', function (e) {
			console.log(grid);
			if (e.detail.isVisible) {
				setGridHeight(grid, -570);
			} else {
				setGridHeight(grid, -430);
			}
		});

		const filterConfig = [{
			key: 'startDate',
			label: '열람 시간 시작일',
			type: 'daterangepicker',
			format: 'YYYY-MM-dd HH:mm',
			value: '2025-01-01 00:00'
		},
		{
			key: 'endDate',
			label: '열람 시간 종료일',
			type: 'daterangepicker',
			format: 'YYYY-MM-dd HH:mm',
			value: '2025-01-31 23:59'
		},
		{
			key: 'employee_cd',
			label: '직원 ID',
			type: 'text',
			placeholder: '사용자 ID 입력',
			col: 'col-md-3'
		},
		{
			key: 'log_sj',
			label: '수행한 작업',
			type: 'text',
			placeholder: '작업명 입력',
			col: 'col-md-3'
		},
		{
			key: 'log_ju',
			label: '정보 유형',
			type: 'text',
			placeholder: '유형 입력',
			col: 'col-md-3'
		},
		{
			key: 'log_oi',
			label: 'IP 주소',
			type: 'text',
			placeholder: 'IP 입력',
			col: 'col-md-3'
		},
		{
			key: 'log_bj',
			label: '클라이언트 정보',
			type: 'text',
			placeholder: '클라이언트 정보 입력',
			col: 'col-md-3'
		},
		];

		// 초기 로그 데이터를 가져와 Grid 초기화 (요약 정보만 조회; log_jd는 포함하지 않음)
		fetch('/select_LOG_SUMMARIES', { // 새 엔드포인트 사용 (select_LOG_SUMMARIES)
			method: 'GET',
			headers: {
				'Content-Type': 'application/json'
			}
		})
			.then(response => {
				if (!response.ok) {
					throw new Error('네트워크 응답이 실패했습니다.');
				}
				return response.json();
			})
			.then(logData => {
				console.log('서버 응답 데이터:', logData);

				// Grid 초기화 – summary 정보만 표시 (log_jd 관련 정보는 제외)
				grid = new tui.Grid({
					el: document.getElementById('grid'),
					data: logData.map(row => ({
						log_cd: row.log_cd,
						employee_cd: row.employee_cd || '',
						log_sj: row.log_sj,
						log_ju: row.log_ju,
						log_od: row.log_od,
						log_oi: row.log_oi,
						log_bj: row.log_bj,
						// 상세조회 시 log_cd를 활용하여 log_jd를 가져올 예정
					})),
					columns: [{
						header: '로그 코드',
						name: 'log_cd',
						sortable: true
					},
					{
						header: '직원 ID',
						name: 'employee_cd',
						sortable: true
					},
					{
						header: '수행한 작업',
						name: 'log_sj',
						align: 'center',
						sortable: true
					},
					{
						header: '정보 유형',
						name: 'log_ju',
						sortable: true
					},
					{
						header: '열람 시간',
						name: 'log_od',
						align: 'center',
						sortable: true
					},
					{
						header: 'IP 주소',
						name: 'log_oi',
						sortable: true
					},
					{
						header: '브라우저 정보',
						name: 'log_bj',
						sortable: true
					},
					{
						header: '상세보기',
						name: 'detail',
						align: 'center',
						sortable: false,
						formatter: function () {
							return '<button class="btn btn-sm btn-primary">보기</button>';
						}
					}
					],
					bodyHeight: 400,
					scrollX: false,
					scrollY: true,
					zIndex: 100,
					summary: {
						height: 40,
						position: 'bottom',
						columnContent: {
							log_bj: {
								template: (valueMap) => {
									return `총  ${valueMap.cnt} 건`
								}
							}
						}
					}
				});

				if (grid) {
					setElementHeight('#div_card', -105);
					setGridHeight(grid, -430);
				} else {
					console.warn('Grid가 초기화되지 않았습니다.');
				}

				// Cell 클릭 이벤트 등록 – "상세보기" 버튼 클릭 시 상세 로그(전체 log_jd)를 AJAX로 조회 후 모달 표시
				grid.on('click', (event) => {
					if (event.columnName === 'detail') {
						const rowData = grid.getRow(event.rowKey);
						const logCd = rowData.log_cd;
						console.log('상세보기 클릭, 로그 코드:', logCd);

						// 상세 로그 조회 (log_jd 포함) – 새 엔드포인트 사용 (예: /select_LOG_DETAIL?logCd=...)
						fetch('/select_LOG_DETAIL?logCd=' + encodeURIComponent(logCd), {
							method: 'GET',
							headers: {
								'Content-Type': 'application/json'
							}
						})
							.then(response => {
								if (!response.ok) {
									throw new Error('네트워크 응답이 실패했습니다.');
								}
								return response.json();
							})
							.then(detailData => {
								console.log('상세 로그 데이터:', detailData);
								// detailData.log_jd가 전체 log_jd 값을 포함한다고 가정
								document.getElementById('modalLogDetails').innerText =
									detailData.log_jdMap ? JSON.stringify(detailData.log_jdMap, null, 2) : '상세 로그 데이터가 없습니다.';

								const modal = new bootstrap.Modal(document.getElementById('logDetailModal'));
								modal.show();
							})
							.catch(error => console.error('상세 로그 조회 오류:', error));
					}
				});
			})
			.catch(error => console.error('오류 발생:', error));

		// 필터 모듈 초기화
		initializeFilterModule('filterModule', filterConfig, (filterValues) => {
			console.log('적용된 필터:', filterValues);

			// 필터 적용 후 서버 요청 및 Grid 갱신
			fetch('/select_FILTERED_LOG', {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					[csrfHeader]: csrfToken
				},
				body: JSON.stringify(filterValues)
			})
				.then(response => response.json())
				.then(filteredData => {
					console.log('필터링된 데이터:', filteredData);
					grid.resetData(filteredData);
				})
				.catch(error => console.error('필터 적용 오류:', error));
		});
	});
</script>

</html>
